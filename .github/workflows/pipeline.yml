name: Contenido, CV y README

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'scripts/**'
      - 'README.md'
      - 'requirements.txt'
      - '.github/styles/**'
      - '.github/workflows/pipeline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc fonts-open-sans libpango-1.0-0 libpangocairo-1.0-0
          pip install -r requirements.txt weasyprint

      - name: Validar contenido
        run: python3 scripts/validate.py

      - name: Generar contenido y documentos
        run: python3 scripts/build.py

      - name: Generar PDF del CV
        run: |
          pandoc CV_Abraham_Escalona.md \
            -s \
            --embed-resources \
            --pdf-engine=weasyprint \
            --css=.github/styles/cv.css \
            -o CV_Abraham_Escalona.pdf

      - name: Commit de los artefactos
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Regenerar contenido, CV y README'
          file_pattern: 'profile.json CV_Abraham_Escalona.md CV_Abraham_Escalona.pdf README.md'
